bundle:
  name: nexus-retail-analytics

# Auto-merge local workspace overrides if the file exists.
# New users: cp databricks.yml.local.example databricks.yml.local
include:
  - "databricks.local.yml"

# ── Variables ──────────────────────────────────────────────────────────────
# Workspace-specific values. Set in databricks.yml.local (gitignored) —
# see databricks.yml.local.example for the template.
# Or pass on the CLI: --var catalog=my_catalog --var warehouse_id=abc123

variables:
  catalog:
    description: "Unity Catalog name to deploy all schemas into. Must already exist."
  warehouse_id:
    description: "SQL warehouse ID used by governance scripts. Find in SQL Warehouse → Connection Details."

# ── Targets ────────────────────────────────────────────────────────────────
# No workspace.host here — taken from databricks.yml.local, CLI --profile,
# or DATABRICKS_HOST env var. databricks.yml.local is auto-merged by DABs.

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production

# ── Resources ──────────────────────────────────────────────────────────────
resources:
  pipelines:
    nexus_retail_pipeline:
      name: "NexusRetail Analytics Pipeline"
      catalog: ${var.catalog}
      schema: online_retail_bronze
      serverless: true
      channel: CURRENT
      continuous: false
      libraries:
        - notebook:
            path: ./src/bronze_layer.py
        - notebook:
            path: ./src/silver_layer.py
        - notebook:
            path: ./src/gold_layer.py
      configuration:
        catalog: ${var.catalog}
        pipeline.env: ${bundle.target}
      clusters: []

  jobs:
    nexus_retail_generate_data:
      name: "NexusRetail — Generate Raw Data"
      tasks:
        - task_key: generate_raw_data
          notebook_task:
            notebook_path: ./setup/01_generate_raw_data.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - faker==24.11.0
              - holidays==0.46
              - python-dateutil
