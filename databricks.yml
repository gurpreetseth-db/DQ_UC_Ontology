bundle:
  name: nexus-retail-analytics

# Merge local workspace overrides automatically.
# New users: cp databricks.local.yml.example databricks.local.yml
include:
  - "databricks.local.yml"

# ── Variables ──────────────────────────────────────────────────────────────
# Set in databricks.local.yml (gitignored). No defaults — bundle validate
# will fail with a clear "required variable" message if the file is missing.
#
# catalog     : UC catalog to deploy all schemas into. Must already exist.
# warehouse_id: ID of a running SQL warehouse.
#               Find it: SQL Warehouses → <name> → Connection Details → HTTP Path
#               (last segment after /warehouses/)

variables:
  catalog:
    description: "Unity Catalog name to deploy all schemas into. Must already exist."
  warehouse_id:
    description: "SQL warehouse ID used by governance and Genie setup. Find in SQL Warehouse → Connection Details."
  owner_user:
    description: "Email of the user who gets unmasked PII access (UC column mask owner)."

# ── Targets ────────────────────────────────────────────────────────────────
# workspace.host and profile are set in databricks.local.yml, not here.

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production

# ── Resources ──────────────────────────────────────────────────────────────
resources:
  pipelines:
    nexus_retail_pipeline:
      name: "NexusRetail Analytics Pipeline"
      catalog: ${var.catalog}
      schema: online_retail_bronze
      serverless: true
      channel: CURRENT
      continuous: false
      libraries:
        - notebook:
            path: ./src/bronze_layer.py
        - notebook:
            path: ./src/silver_layer.py
        - notebook:
            path: ./src/gold_layer.py
      configuration:
        catalog: ${var.catalog}
        pipeline.env: ${bundle.target}
      clusters: []

  jobs:
    nexus_retail_generate_data:
      name: "NexusRetail — Generate Raw Data"
      tasks:
        - task_key: generate_raw_data
          notebook_task:
            notebook_path: ./setup/01_generate_raw_data.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - faker==24.11.0
              - holidays==0.46
              - python-dateutil

    nexus_retail_governance:
      name: "NexusRetail — Governance Setup"
      tasks:
        - task_key: run_governance
          notebook_task:
            notebook_path: ./governance/run_governance.py
            base_parameters:
              catalog:      ${var.catalog}
              warehouse_id: ${var.warehouse_id}
              owner_user:   ${var.owner_user}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"

    nexus_retail_genie_setup:
      name: "NexusRetail — Genie Setup"
      tasks:
        - task_key: genie_setup
          notebook_task:
            notebook_path: ./setup/02_genie_setup.py
            base_parameters:
              catalog:      ${var.catalog}
              warehouse_id: ${var.warehouse_id}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
